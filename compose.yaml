# Airflow 3 (LocalExecutor) + one PostgreSQL 17 holding two databases:
# `airflow` (Airflow's metadata) and `warehouse` (the data, loaded and modelled).
name: airflow3-elt

x-airflow-common: &airflow-common
  build: .
  image: airflow3-elt:local
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env (copy .env.example)}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Local demo: the UI is bound to 127.0.0.1 and everyone is admin, no login.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # The warehouse, for tlc-ingest and dbt (libpq variables) ...
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: warehouse
    PGPASSWORD: ${WAREHOUSE_PASSWORD:?set WAREHOUSE_PASSWORD in .env}
    PGDATABASE: warehouse
    # ... and for the quality gate and publish tasks (an Airflow connection).
    AIRFLOW_CONN_WAREHOUSE: postgresql://warehouse:${WAREHOUSE_PASSWORD}@postgres:5432/warehouse
    # Pipeline settings (see .env.example).
    TLC_MAX_ROWS: ${TLC_MAX_ROWS:-50000}
    TLC_BASE_URL: ${TLC_BASE_URL:-https://d37ci6vzurychx.cloudfront.net}
    QUALITY_MIN_VALID_PCT: ${QUALITY_MIN_VALID_PCT:-90}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./faults:/opt/airflow/faults
    - airflow-logs:/opt/airflow/logs
    - tlc-cache:/opt/airflow/tlc-cache
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:?set WAREHOUSE_PASSWORD in .env}
    # Same bulk-load settings as the warehouse repo, scaled to a laptop sample.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
    shm_size: 512mb
    mem_limit: ${PG_MEM_LIMIT:-2g}
    # 5433, not 5432: the warehouse repo's own PostgreSQL may be running on 5432.
    ports:
      - "127.0.0.1:${WAREHOUSE_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate && airflow version"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  # One-off commands: docker compose run --rm airflow-cli airflow dags list
  airflow-cli:
    <<: *airflow-common
    profiles: [cli]
    command: ["airflow", "version"]

  # A stand-in for the TLC CDN that serves files from ./faults/www (HEAD, ETag and
  # Range requests, like the real one). Used to feed the pipeline a corrupted month.
  fake-cdn:
    image: nginx:1.27-alpine
    profiles: [faults]
    volumes:
      - ./faults/www:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  pgdata:
  airflow-logs:
  tlc-cache:
