# Tooling config only. Airflow itself is installed from the official constraints
# file (see .github/workflows/ci.yml and the README), not resolved from here.
[project]
name = "airflow3-elt-pipeline"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["dags", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "tlc_ingest", "dbt_warehouse", "publish_marts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
